{% extends "base.html" %}

{% block title %}الخدمات - طرّة{% endblock %}

{% block extra_css %}
<style>
    .services-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        gap: 15px;
    }

    .service-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }

    .service-card {
        background: var(--white);
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        border-top: 4px solid var(--gold);
        transition: all 0.3s ease;
    }

    .dark-theme .service-card {
        background: var(--accent);
    }

    .service-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(212, 175, 55, 0.15);
    }

    .service-type {
        font-size: 13px;
        background: var(--gold);
        color: var(--dark);
        padding: 6px 12px;
        border-radius: 20px;
        display: inline-block;
        font-weight: 600;
        margin-bottom: 15px;
    }

    .service-details {
        display: flex;
        justify-content: space-between;
        margin: 15px 0;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
    }

    .dark-theme .service-details {
        border-bottom-color: #333;
    }

    .detail-label {
        color: var(--gray);
        font-size: 12px;
    }

    .detail-value {
        font-weight: 700;
        color: var(--dark);
    }

    .dark-theme .detail-value {
        color: #fff;
    }

    .service-actions {
        display: flex;
        gap: 8px;
        margin-top: 15px;
    }

    .service-actions button {
        flex: 1;
        padding: 8px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: all 0.3s ease;
    }
</style>
{% endblock %}

{% block content %}
<div class="services-header">
    <h1>🔧 إدارة الخدمات</h1>
    <button class="btn btn-primary" onclick="openAddServiceModal()">+ إضافة خدمة</button>
</div>

<div style="margin-bottom: 25px;">
    <select id="serviceTypeFilter" onchange="loadServices()" style="padding: 10px 15px; border: 1px solid var(--border); border-radius: 8px;">
        <option value="">جميع أنواع الخدمات</option>
        <option value="تمصير">تمصير (Wrapping)</option>
        <option value="تقصير المصر من الأطراف">تقصير المصر من الأطراف (Edge Shortening)</option>
        <option value="قص المصر من النصف">قص المصر من النصف (Half Cutting)</option>
    </select>
</div>

<div class="service-grid" id="serviceGrid">
    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #999;">جاري التحميل...</div>
</div>

<!-- Add Service Modal -->
<div id="serviceModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="serviceModalTitle">إضافة خدمة جديدة</h2>
            <button class="close-btn" onclick="closeServiceModal()">&times;</button>
        </div>
        <form id="serviceForm" onsubmit="saveService(event)">
            <div class="form-group">
                <label>نوع الخدمة</label>
                <select id="serviceType" required>
                    <option value="">اختر نوع الخدمة</option>
                    <option value="تمصير">تمصير</option>
                    <option value="تقصير المصر من الأطراف">تقصير المصر من الأطراف</option>
                    <option value="قص المصر من النصف">قص المصر من النصف</option>
                </select>
            </div>
            <div class="form-group">
                <label>اسم العميل (اختياري)</label>
                <input type="text" id="customerNameService">
            </div>
            <div class="form-group">
                <label>السعر المفروض</label>
                <input type="number" id="priceChargedService" step="0.01" required>
            </div>
            <div class="form-group">
                <label>التكلفة (اختياري)</label>
                <input type="number" id="costService" step="0.01">
            </div>
            <div class="form-group">
                <label>تاريخ الخدمة</label>
                <input type="date" id="serviceDateInput" required>
            </div>
            <div class="form-group">
                <label>ملاحظات (اختياري)</label>
                <textarea id="notesService" rows="3"></textarea>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                <button type="button" class="btn btn-secondary" onclick="closeServiceModal()">إلغاء</button>
                <button type="submit" class="btn btn-primary">حفظ</button>
            </div>
        </form>
    </div>
</div>

<script>
    let currentServiceId = null;

    async function loadServices() {
        const serviceType = document.getElementById('serviceTypeFilter').value;
        const url = `/api/services${serviceType ? '?type=' + encodeURIComponent(serviceType) : ''}`;

        try {
            const response = await fetch(url);
            const data = await response.json();

            const html = data.services.map(service => `
                <div class="service-card">
                    <span class="service-type">${service.type}</span>
                    <div class="service-details">
                        <div>
                            <div class="detail-label">العميل</div>
                            <div class="detail-value">${service.customer || '-'}</div>
                        </div>
                        <div>
                            <div class="detail-label">التاريخ</div>
                            <div class="detail-value">${new Date(service.date).toLocaleDateString('ar-OM')}</div>
                        </div>
                    </div>
                    <div class="service-details">
                        <div>
                            <div class="detail-label">السعر</div>
                            <div class="detail-value">${service.price.toFixed(2)} OMR</div>
                        </div>
                        <div>
                            <div class="detail-label">التكلفة</div>
                            <div class="detail-value">${service.cost.toFixed(2)} OMR</div>
                        </div>
                    </div>
                    <div class="service-details">
                        <div>
                            <div class="detail-label">الربح</div>
                            <div class="detail-value" style="color: var(--success);">${service.profit.toFixed(2)} OMR</div>
                        </div>
                    </div>
                    <div class="service-actions">
                        <button class="btn btn-edit" onclick="editService(${service.id})">تعديل</button>
                        <button class="btn btn-delete" onclick="deleteService(${service.id})">حذف</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('serviceGrid').innerHTML = html || '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #999;">لا توجد خدمات</div>';
        } catch (error) {
            console.error('Error loading services:', error);
        }
    }

    function openAddServiceModal() {
        currentServiceId = null;
        document.getElementById('serviceModalTitle').textContent = 'إضافة خدمة جديدة';
        document.getElementById('serviceForm').reset();
        document.getElementById('serviceDateInput').valueAsDate = new Date();
        document.getElementById('serviceModal').classList.add('show');
    }

    function closeServiceModal() {
        document.getElementById('serviceModal').classList.remove('show');
    }

    async function saveService(e) {
        e.preventDefault();

        const serviceData = {
            service_type: document.getElementById('serviceType').value,
            customer_name: document.getElementById('customerNameService').value,
            price_charged: document.getElementById('priceChargedService').value,
            cost: document.getElementById('costService').value || 0,
            service_date: document.getElementById('serviceDateInput').value,
            notes: document.getElementById('notesService').value
        };

        try {
            const method = currentServiceId ? 'PUT' : 'POST';
            const url = currentServiceId ? `/api/services/${currentServiceId}` : '/api/services';

            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(serviceData)
            });

            if (response.ok) {
                closeServiceModal();
                loadServices();
                alert('تم الحفظ بنجاح!');
            }
        } catch (error) {
            alert('خطأ في حفظ الخدمة');
        }
    }

    async function editService(serviceId) {
        currentServiceId = serviceId;
        document.getElementById('serviceModalTitle').textContent = 'تعديل الخدمة';

        try {
            const response = await fetch(`/api/services/${serviceId}`);
            const service = await response.json();

            document.getElementById('serviceType').value = service.type;
            document.getElementById('customerNameService').value = service.customer || '';
            document.getElementById('priceChargedService').value = service.price;
            document.getElementById('costService').value = service.cost;
            document.getElementById('serviceDateInput').value = service.date;
            document.getElementById('notesService').value = service.notes || '';

            document.getElementById('serviceModal').classList.add('show');
        } catch (error) {
            alert('خطأ في تحميل بيانات الخدمة');
        }
    }

    async function deleteService(serviceId) {
        if (!confirm('هل أنت متأكد من حذف هذه الخدمة؟')) return;

        try {
            await fetch(`/api/services/${serviceId}`, { method: 'DELETE' });
            loadServices();
            alert('تم الحذف بنجاح!');
        } catch (error) {
            alert('خطأ في حذف الخدمة');
        }
    }

    loadServices();
</script>
{% endblock %}
